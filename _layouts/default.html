<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
      .recipe-timer {
        display: inline-flex;
        align-items: center;
        background: #f8f9fa;
        border: 2px solid #dee2e6;
        border-radius: 8px;
        padding: 8px 12px;
        margin: 8px 0;
        font-family: monospace;
        font-size: 14px;
      }
      .timer-display {
        font-weight: bold;
        margin: 0 8px;
        min-width: 60px;
        color: #495057;
      }
      .timer-button {
        background: #007bff;
        color: white;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        margin: 0 2px;
        font-size: 12px;
      }
      .timer-button:hover {
        background: #0056b3;
      }
      .timer-button:disabled {
        background: #6c757d;
        cursor: not-allowed;
      }
      .timer-running {
        border-color: #28a745;
        background: #d4edda;
      }
      .timer-finished {
        border-color: #dc3545;
        background: #f8d7da;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    {{ content }}
    <script>
      class RecipeTimer {
        constructor(containerId, minutes) {
          this.containerId = containerId;
          this.totalSeconds = minutes * 60;
          this.remainingSeconds = this.totalSeconds;
          this.isRunning = false;
          this.intervalId = null;
          this.container = document.getElementById(containerId);
          this.init();
        }
        
        init() {
          this.container.innerHTML = `
            <span>⏲️</span>
            <span class="timer-display">${this.formatTime(this.remainingSeconds)}</span>
            <button class="timer-button start-btn" onclick="timers['${this.containerId}'].start()">Start</button>
            <button class="timer-button pause-btn" onclick="timers['${this.containerId}'].pause()" disabled>Pause</button>
            <button class="timer-button reset-btn" onclick="timers['${this.containerId}'].reset()">Reset</button>
          `;
        }
        
        start() {
          if (this.isRunning) return;
          this.isRunning = true;
          this.container.classList.add('timer-running');
          this.container.querySelector('.start-btn').disabled = true;
          this.container.querySelector('.pause-btn').disabled = false;
          
          this.intervalId = setInterval(() => {
            this.remainingSeconds--;
            this.updateDisplay();
            
            if (this.remainingSeconds <= 0) {
              this.finish();
            }
          }, 1000);
        }
        
        pause() {
          if (!this.isRunning) return;
          this.isRunning = false;
          clearInterval(this.intervalId);
          this.container.classList.remove('timer-running');
          this.container.querySelector('.start-btn').disabled = false;
          this.container.querySelector('.pause-btn').disabled = true;
        }
        
        reset() {
          this.pause();
          this.remainingSeconds = this.totalSeconds;
          this.container.classList.remove('timer-finished', 'timer-running');
          this.updateDisplay();
        }
        
        finish() {
          this.pause();
          this.container.classList.add('timer-finished');
          this.container.classList.remove('timer-running');
          
          // Play notification sound
          this.playNotificationSound();
          
          // Try to show a notification
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Timer Finished!', {
              body: `Your ${this.totalSeconds / 60} minute timer has finished.`,
              icon: '⏰'
            });
          } else {
            alert(`Timer finished! (${this.totalSeconds / 60} minutes)`);
          }
        }
        
        playNotificationSound() {
          try {
            // Create an AudioContext for generating a beep sound
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            // Connect the nodes
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Set up the beep sound (3 beeps)
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime); // 800 Hz tone
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            
            // First beep
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0, audioContext.currentTime + 0.3);
            
            // Second beep
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0, audioContext.currentTime + 0.7);
            
            // Third beep
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + 0.9);
            gainNode.gain.setValueAtTime(0, audioContext.currentTime + 1.1);
            
            // Start and stop the oscillator
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1.2);
          } catch (error) {
            // Fallback: try to play a simple beep using the browser's built-in sounds
            console.log('Could not play audio notification:', error);
            // Some browsers support this simple beep
            try {
              const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmUaAD2U2O3AbSUFLYPH8dCJNgcX...'); // base64 encoded beep sound
              audio.play();
            } catch (e) {
              console.log('Fallback audio also failed');
            }
          }
        }
        
        updateDisplay() {
          const display = this.container.querySelector('.timer-display');
          display.textContent = this.formatTime(this.remainingSeconds);
        }
        
        formatTime(seconds) {
          const mins = Math.floor(seconds / 60);
          const secs = seconds % 60;
          return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
      }
      
      // Global timer registry
      window.timers = {};
      window.pendingTimers = [];
      
      // Function to create a timer
      function createTimer(containerId, minutes) {
        if (document.readyState === 'loading') {
          window.pendingTimers.push({containerId, minutes});
        } else {
          const container = document.getElementById(containerId);
          if (container) {
            window.timers[containerId] = new RecipeTimer(containerId, minutes);
          }
        }
      }
      
      // Initialize all timers when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
        
        // Initialize any pending timers
        window.pendingTimers.forEach(({containerId, minutes}) => {
          const container = document.getElementById(containerId);
          if (container) {
            window.timers[containerId] = new RecipeTimer(containerId, minutes);
          }
        });
        window.pendingTimers = [];
        
        // Also initialize any timers that might be created after DOM load
        setTimeout(() => {
          document.querySelectorAll('.recipe-timer').forEach(container => {
            if (!window.timers[container.id] && container.dataset.minutes) {
              window.timers[container.id] = new RecipeTimer(container.id, parseInt(container.dataset.minutes));
            }
          });
        }, 100);
      });
    </script>
  </body>
</html>
