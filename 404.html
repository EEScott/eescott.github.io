<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #080707;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .skull-image {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        h1 {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            padding: 15px 40px;
            background: #a24b4b;
            /* background: linear-gradient(135deg, #000000 0%, #a24b4b 100%); */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .home-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(162, 75, 75, 0.4);
        }

        .home-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/images/skull-drawing-black2.png" alt="Skull Drawing" class="skull-image">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Oops! The page you're looking for has vanished into the void. It might have been moved, deleted, or never existed in the first place.</p>
        <a href="/" class="home-button">Go Home</a>
    </div>
</body>
</html>
